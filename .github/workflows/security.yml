name: API Security Scanner Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run API Security Scanner
        uses: apisecurityscanner/apisecurityscanner.github.io@v1.0.0
        with:
          license-key: ${{ secrets.SCANNER_LICENSE_KEY }}
          spec: openapi.json
          scan-source: .
          fail-on: none
          auto-pr: true

