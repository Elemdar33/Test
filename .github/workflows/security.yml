name: API Security Scanner Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run API Security Scanner
        uses: apisecurityscanner/apisecurityscanner.github.io@v1.0.0
        with:
          license-key: 'sec_live_pro123456789012345678901_a97c82c77a'
          spec: openapi.json
          scan-source: .
          auto-pr: true
          fail-on: none
